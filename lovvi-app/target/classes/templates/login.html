<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lovvi - Login">
    <title>Login - Lovvi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="lovvi-app-shell">
    <div class="auth-page">
        <header class="page-header">
            <p class="app-kicker">Lovvi</p>
            <h1 class="page-title">Entrar no app</h1>
            <p class="page-subtitle">Use o ID do usuario para abrir a experiencia de cards.</p>
        </header>

        <div class="login-card">
            <div id="loginMsg"></div>

            <form id="formLogin">
                <div class="form-row">
                    <div class="field">
                        <label for="idUsuario">ID do usuario</label>
                        <input type="number" id="idUsuario" name="idUsuario" min="1" placeholder="Ex.: 1" required>
                    </div>
                </div>

                <div class="form-actions" style="flex-direction: column; gap: 0.75rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
                    <a href="/cadastro" class="btn btn-outline" style="width: 100%;">Criar novo perfil</a>
                    <a href="/" class="btn btn-back" style="width: 100%;">Voltar para Home</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
